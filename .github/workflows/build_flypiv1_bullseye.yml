name: Build Armbian Fly Pi v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-armbian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Userpatches Board Configuration
        run: |
          # Ensure userpatches directory exists in your repo
          mkdir -p userpatches/config/boards
          
          # If your config is somewhere else, move/copy it here
          if [ -f "config/boards/flypiv1.conf" ]; then
            cp config/boards/flypiv1.conf userpatches/config/boards/
          fi

          # Fallback check: if it's already in userpatches, ensure it's there
          # (Modify BOOTCONFIG to use the standard Allwinner H5 defconfig fallback)
          if [ -f "userpatches/config/boards/flypiv1.conf" ]; then
            sed -i 's/BOOTCONFIG="fly_pi_v1_defconfig"/BOOTCONFIG="orangepi_pc2_defconfig"/' userpatches/config/boards/flypiv1.conf || true
          fi

      - name: Setup Official Armbian Build Environment
        run: |
          git clone --depth 1 https://github.com/armbian/build.git ~/armbian-official
          
          # Copy userpatches from your repository workspace into the official build folder
          cp -r userpatches/* ~/armbian-official/userpatches/ || true

      - name: Run Build Script
        run: |
          cd ~/armbian-official
          ./compile.sh build BOARD=flypiv1 BRANCH=current RELEASE=bullseye BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no

      - name: Upload Generated Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armbian-flypiv1-bullseye-image
          path: ~/armbian-official/output/images/*.img*
