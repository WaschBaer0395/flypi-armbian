name: Build Armbian Fly Pi v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-armbian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Setup Official Armbian Build Environment
        run: |
          git clone --depth 1 https://github.com/armbian/build.git ~/armbian-official
          mkdir -p ~/armbian-official/userpatches
          cp -r userpatches/* ~/armbian-official/userpatches/ 2>/dev/null || true

      - name: Run Build Script
        run: |
          cd ~/armbian-official
          ./compile.sh build BOARD=flypiv1 BRANCH=current RELEASE=bullseye BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no
          
      - name: Upload Generated Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armbian-flypiv1-bullseye-image
          path: ~/armbian-official/output/images/*.img*
